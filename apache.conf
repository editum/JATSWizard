# ************************************
# Vhost template in module puppetlabs-apache
# Managed by Puppet
# ************************************
# 
<VirtualHost *:80>
  ServerName revistas.test.um.es

  ## Vhost docroot
  DocumentRoot "/opt/ojs"

  ## Directories, there should at least be a declaration for /opt/ojs

  <LocationMatch "/status">
    Require ip 127.0.0.1
    Require ip ::1
    Require ip 155.54.218.91
    Require ip 155.54.212.28
    Require ip 155.54.212.29
    Require ip 155.54.212.48/29
    Require ip 155.54.66.118
    Require all denied
    ProxyPass 'fcgi://127.0.0.1:9000'

  </LocationMatch>

  <LocationMatch "/ping">
    Require ip 127.0.0.1
    Require ip ::1
    Require ip 155.54.212.236
    Require ip 155.54.212.237
    Require ip 155.54.218.60
    Require ip 155.54.218.61
    Require ip 2001:720:1710:618::2
    Require ip 2001:720:1710:618::3
    Require ip 2001:720:1710:603::2
    Require ip 2001:720:1710:603::3
    Require ip 155.54.66.118
    Require all denied
    ProxyPass 'fcgi://127.0.0.1:9000'

  </LocationMatch>

  <Directory "/opt/ojs">
    Options FollowSymLinks MultiViews
    AllowOverride AuthConfig FileInfo Limit
    Require all granted
    <Limit GET POST OPTIONS PROPFIND>
  <RequireAll>
    Require all granted
    Require not ip 32.1.7.32
  </RequireAll>
</Limit>
<LimitExcept GET POST OPTIONS PROPFIND>
        Require all denied
</LimitExcept>
<FilesMatch "\.(jpe?g|png|gif|js|css)$|page\/css">
  ExpiresActive On
  ExpiresDefault "access plus 1 week"
</FilesMatch>
SetEnvIf Remote_Addr ^127\.0\.0\.1$ client_is_local

  </Directory>

  <Directory "/tmp">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/ojs/content">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/ojs/images">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/ojs/img">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/ojs/public">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/filesojs/temp">
    AllowOverride None
    <FilesMatch "\.(php$|html)$">
  SetHandler none
  Require all denied
</FilesMatch>

  </Directory>

  <Directory "/opt/ojs/*">
    AllowOverride None
  </Directory>

  ## JATS Pipeline (Symfony)
  Alias /jats-pipeline "/opt/docxtojats-pipeline/public"
  <Directory "/opt/docxtojats-pipeline/public">
    Options FollowSymLinks MultiViews
    AllowOverride All
    Require all granted
    
    FallbackResource /jats-pipeline/index.php

    <FilesMatch "\.php$">
      SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>
  </Directory>

  <LocationMatch "^/public/.*\.(php$|html)$">
    Require all denied
  </LocationMatch>

  <LocationMatch "^/wizard/output/.*\.(php|php4|php5|phpp7|php74|phtml|html)$">
    Require all denied
  </LocationMatch>

  ## Logging
  ErrorLog "| /usr/bin/logger -p local0.err -t apache2"
  ServerSignature Off
  CustomLog "| /usr/bin/logger -p local0.info -t apache2" "vhost_combined" env=!forwarded
  CustomLog "| /usr/bin/logger -p local0.info -t apache2" "vhost_proxy_combined" env=forwarded

  ## Header rules
  ## as per http://httpd.apache.org/docs/2.2/mod/mod_headers.html#header
  Header set Strict-Transport-Security "max-age=63072000; includeSubdomains;"

  ## Proxy rules
  ProxyRequests Off
  ProxyPreserveHost Off

  ## Proxy rules for JATS Pipeline
  ProxyPassMatch ^/jats-pipeline/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9000/opt/docxtojats-pipeline/public/$1 retry=0
  ProxyPassReverse ^/jats-pipeline/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9000/opt/docxtojats-pipeline/public/$1

  ## Proxy rules for OJS
  ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9000/opt/ojs/$1 retry=0
  ProxyPassReverse ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9000/opt/ojs/$1
  SetEnvIf X-Forwarded-For "^(.+\..+\..+\..+|\[.+\])$" forwarded
</VirtualHost>
