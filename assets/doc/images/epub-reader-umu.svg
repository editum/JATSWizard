<svg xmlns="http://www.w3.org/2000/svg" width="560" height="860" viewBox="0 0 560 860" role="img" aria-labelledby="title description">
  <title id="title">EDITUM virtual ePub tablet reader</title>
  <desc id="description">Portrait schematic of the fixed EDITUM ePub reader shell, with a dark teal tablet frame, reading toolbar, sample article page, progress bar and previous and next controls.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06434a"/>
      <stop offset="0.58" stop-color="#002b32"/>
      <stop offset="1" stop-color="#00191f"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07505a"/>
      <stop offset="1" stop-color="#00232a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="30" y="18" width="500" height="824" rx="34" fill="url(#shell)" stroke="#001419" stroke-width="12" filter="url(#shadow)"/>
  <path d="M52 45 Q280 25 508 45" fill="none" stroke="#75a3a2" stroke-opacity=".32" stroke-width="2"/>

  <g font-family="Arial, sans-serif">
    <text x="64" y="86" fill="#ffffff" font-size="17" font-weight="700" letter-spacing="1">EDITUM</text>
    <text x="64" y="106" fill="#c3d5d4" font-size="12" font-style="italic">revistas.um.es</text>

    <g fill="#f7faf9" stroke="#527579" stroke-width="1.5">
      <rect x="266" y="60" width="42" height="40" rx="9"/>
      <rect x="313" y="60" width="42" height="40" rx="9"/>
      <rect x="360" y="60" width="42" height="40" rx="9"/>
      <rect x="407" y="60" width="42" height="40" rx="9"/>
      <rect x="454" y="60" width="42" height="40" rx="9"/>
    </g>
    <g fill="#164047" font-size="21" text-anchor="middle">
      <text x="287" y="87">&#8249;</text>
      <text x="334" y="87">&#9776;</text>
      <text x="381" y="87">&#8250;</text>
      <text x="428" y="87">&#9734;</text>
      <text x="475" y="87">Aa</text>
    </g>

    <rect x="52" y="123" width="456" height="622" rx="13" fill="#101415" stroke="#24383a" stroke-width="3"/>
    <rect x="63" y="134" width="434" height="600" rx="7" fill="#f3f1e9"/>
    <path d="M70 134 H490 Q497 134 497 141 V182 H63 V141 Q63 134 70 134" fill="#e6e5dc"/>
    <text x="83" y="164" fill="#38655f" font-size="12" font-weight="700">ARTÍCULO DE INVESTIGACIÓN</text>

    <text x="91" y="224" fill="#202b2b" font-family="Georgia, serif" font-size="24" font-weight="700">Título del artículo</text>
    <text x="91" y="253" fill="#53605d" font-family="Georgia, serif" font-size="14">Autoría y datos de publicación</text>
    <line x1="91" y1="274" x2="468" y2="274" stroke="#c6cdc6"/>
    <text x="91" y="312" fill="#305e57" font-family="Georgia, serif" font-size="17" font-weight="700">Resumen</text>
    <g fill="#626b67">
      <rect x="91" y="328" width="377" height="7" rx="3.5"/>
      <rect x="91" y="343" width="366" height="7" rx="3.5"/>
      <rect x="91" y="358" width="374" height="7" rx="3.5"/>
      <rect x="91" y="373" width="319" height="7" rx="3.5"/>
    </g>
    <text x="91" y="420" fill="#305e57" font-family="Georgia, serif" font-size="17" font-weight="700">Introducción</text>
    <g fill="#626b67">
      <rect x="91" y="436" width="377" height="7" rx="3.5"/>
      <rect x="91" y="451" width="363" height="7" rx="3.5"/>
      <rect x="91" y="466" width="374" height="7" rx="3.5"/>
      <rect x="91" y="481" width="346" height="7" rx="3.5"/>
      <rect x="91" y="496" width="375" height="7" rx="3.5"/>
      <rect x="91" y="511" width="287" height="7" rx="3.5"/>
    </g>
    <rect x="91" y="537" width="377" height="118" rx="4" fill="#d9e8e2"/>
    <path d="M115 640 L188 574 L244 614 L302 560 L360 616 L415 581 L446 640Z" fill="#7ca69a"/>
    <circle cx="383" cy="576" r="13" fill="#e0aa63"/>
    <text x="91" y="675" fill="#707874" font-family="Georgia, serif" font-size="11">Figura y contenido de ejemplo</text>

    <rect x="75" y="687" width="410" height="35" fill="#e6e5dc"/>
    <text x="83" y="709" fill="#5d625f" font-size="12">24%</text>
    <rect x="126" y="701" width="335" height="5" rx="2.5" fill="#c4c6bf"/>
    <rect x="126" y="701" width="80" height="5" rx="2.5" fill="#286a5b"/>

    <rect x="92" y="773" width="90" height="42" rx="16" fill="url(#button)" stroke="#001217" stroke-width="2"/>
    <rect x="378" y="773" width="90" height="42" rx="16" fill="url(#button)" stroke="#001217" stroke-width="2"/>
    <text x="137" y="802" fill="#ffffff" font-size="25" text-anchor="middle">&#8249;</text>
    <text x="423" y="802" fill="#ffffff" font-size="25" text-anchor="middle">&#8250;</text>
    <text x="280" y="794" fill="#e2eeee" font-size="14" font-weight="700" text-anchor="middle">UMU</text>
    <text x="280" y="813" fill="#a9c5c3" font-size="10" text-anchor="middle">UNIVERSIDAD DE MURCIA</text>
  </g>
</svg>
